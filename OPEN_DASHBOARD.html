<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="1;url=http://127.0.0.1:5000/dashboard">
    <title>Opening RevenueIQ Dashboard...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0a1128 0%, #1e293b 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 60px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .loader {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(79, 70, 229, 0.3);
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            display: inline-block;
            background: #4f46e5;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 1.2em;
        }
        a:hover {
            background: #3b82f6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 RevenueIQ</h1>
        <p style="font-size: 1.3em;">Opening Dashboard...</p>
        <div class="loader"></div>
        <p>Redirecting to your application...</p>
        <a href="http://127.0.0.1:5000/dashboard">Click Here if Not Redirected</a>
    </div>
</body>
</html>
